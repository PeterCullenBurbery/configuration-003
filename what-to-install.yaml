KeePass has some advantages over KeePassXC like:
  - KeePass does not disappear when you try to take a screenshot
  - whereas KeePassXC will disappear when you take a screenshot
  - you don't have to type in 2718 PIN every time.
minor:
  - you can install plugins. I think KeePassXC does not support plugins.
  - KeePassXC does support advanced; KeePass does not.